name: Deploy PRODESIGN API SERVICES 2D, 3D

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Sincronizar archivos
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          SOURCE: "./"
          TARGET: "/home/ftpceon/ftp/prodesign/prosesign_geometry_api/"
          ARGS: "-rlgoDzvc -i"
          EXCLUDE: >
            /.git/,
            /.github/,
            __pycache__/,
            .venv/,
            logs/,
            renders/,
            renders_ai/

      - name: Desplegar con Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/ftpceon/ftp/prodesign/prosesign_geometry_api

            echo "Validando docker-compose..."
            docker compose config > /dev/null

            echo "Construyendo imágenes..."
            docker compose -p prodesign build

            echo "Actualizando contenedores..."
            docker compose -p prodesign up -d

            echo "Mostrando estado..."
            docker compose -p prodesign ps