services:
  # Servicio de Geometría (Python/FastAPI)
  geometry-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodesign-geometry-api
    ports:
      - "8006:8001"
    volumes:
      - .:/app
    networks:
      - prodesign_network
    depends_on:
      - redis
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: redis_bim
    command: redis-server --requirepass prodesign123
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - prodesign_network 

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodesign-worker
    command: python worker.py
    volumes:
      - .:/app
    networks:
      - prodesign_network
    depends_on:
      - redis
      - geometry-api

networks:
  prodesign_network:
    external: true